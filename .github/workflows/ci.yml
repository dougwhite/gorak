name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Build wheel and source distribution
        run: uv build

  ecosystem:
    name: Publish development candidate and propose consumer updates
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gorak-ecosystem-propagation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish candidate and open or advance compatibility PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ECOSYSTEM_PR_TOKEN: ${{ secrets.ECOSYSTEM_PR_TOKEN }}
        run: python scripts/ecosystem_release.py
      - name: Reconcile published dependency releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ECOSYSTEM_PR_TOKEN: ${{ secrets.ECOSYSTEM_PR_TOKEN }}
        run: python scripts/ecosystem_dependencies.py --reconcile
