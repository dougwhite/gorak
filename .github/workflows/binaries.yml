name: gorak binaries

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*'
      # Ecosystem compatibility candidates are not public binary releases.
      - '!v*dev.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Embedded release tag (empty uses the package release tag); does not create a tag'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            executable: gorak-linux-x64
          - os: windows-2022
            platform: windows-x64
            executable: gorak-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GORAK_BUILD_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --group build
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - name: Build release executable
        if: github.event_name == 'push'
        run: uv run --locked --group build python scripts/build_binary.py --release
      - name: Build review executable
        if: github.event_name != 'push'
        run: uv run --locked --group build python scripts/build_binary.py
      - run: uv run --locked python scripts/smoke_binary.py dist/binary/${{ matrix.executable }}
      - run: uv run --locked python scripts/assemble_binary_release.py dist/binary --allow-partial
      - name: Exercise Linux installer against local artifacts
        if: runner.os == 'Linux'
        run: sh scripts/install.sh --from-directory dist/binary --directory "$RUNNER_TEMP/gorak-installer-smoke"
      - name: Exercise Windows user installer against local artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Scope User -Directory "$env:RUNNER_TEMP\gorak-installer-smoke" -FromDirectory dist/binary
      - name: Exercise protected Windows helper offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke_system_update.ps1 -Binary dist/binary/gorak-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gorak-${{ matrix.platform }}
          path: |
            dist/binary/${{ matrix.executable }}
            dist/binary/*.manifest.json
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gorak-*
          path: dist/binary
          merge-multiple: true
      - run: python scripts/assemble_binary_release.py dist/binary
      - uses: actions/upload-artifact@v4
        with:
          name: gorak-release-review
          # Allow time for owner review; published release assets are separate.
          retention-days: 14
          path: dist/binary/*
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'dougwhite/gorak'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gorak-release-review
          path: dist/binary
      - name: Verify release files
        working-directory: dist/binary
        run: sha256sum --check SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # gh stages the release as a draft, uploads every file, then publishes.
        # An existing release causes failure rather than replacing public assets.
        run: |
          gh release create "$RELEASE_TAG" \
            dist/binary/gorak-linux-x64 \
            dist/binary/gorak-windows-x64.exe \
            dist/binary/install.sh \
            dist/binary/install.ps1 \
            dist/binary/gorak-release.json \
            dist/binary/SHA256SUMS \
            --verify-tag --generate-notes --latest --prerelease=false \
            --title "gorak $RELEASE_TAG"
